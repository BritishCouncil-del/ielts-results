<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        /* الخلفية الكاملة المأخوذة من واجهة الموقع الأصلي */
        .bg-container {
            background-image: url('buti.jpg'); 
            background-size: cover;
            background-position: center;
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* الكارت الأبيض في المنتصف مع حواف حمراء دقيقة */
        .login-card {
            background-color: rgba(255, 255, 255, 0.98);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            padding: 30px 25px;
            text-align: center;
            border-top: 4px solid #D61A22; 
        }

        /* شعار ايلتس الملون */
        .logo-ielts {
            color: #D61A22;
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .sub-logo {
            color: #D61A22;
            font-style: italic;
            font-size: 13px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .title {
            color: #1F2937;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6B7280;
            font-size: 12px;
            margin-bottom: 25px;
        }

        /* الحقول والنماذج */
        .input-group {
            margin-bottom: 15px;
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #D1D5DB;
            border-radius: 6px;
            font-size: 14px;
            text-align: right;
            outline: none;
            transition: border-color 0.2s;
            color: #374151;
        }

        .input-field:focus {
            border-color: #1D4ED8;
        }

        /* زر عرض النتيجة الأزرق */
        .btn-submit {
            width: 100%;
            background-color: #1D4ED8;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #1E40AF;
        }
    </style>
</head>
<body>

    <div class="bg-container">
        <div class="login-card">
            <div class="logo-ielts">IELTS</div>
            <div class="sub-logo">English for International Opportunity</div>
            
            <div class="title">Test Report Form Portal</div>
            <div class="subtitle">أدخل بياناتك للتحقق من نتيجة IELTS الخاصة بك</div>
            
            <form id="loginForm">
                <div class="input-group">
                    <input type="text" id="candidateNumber" class="input-field" placeholder="509284" required>
                </div>
                <div class="input-group">
                    <input type="text" id="trfNumber" class="input-field" placeholder="26AE509284ALSB113A" required>
                </div>
                <button type="submit" class="btn-submit">عرض النتيجة</button>
            </form>
        </div>
    </div>

    <script>
        // التوجيه لصفحة النتائج مباشرة عند الضغط على الزر
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // الانتقال لملف صفحة النتيجة 
            window.location.href = "results-502984.html";
        });
    </script>
</body>
</html>
