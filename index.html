<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IELTS TRF Portal</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      text-align: center;
    }
    header {
      background: #b30000; /* البار الأحمر */
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    header img {
      height: 40px;
      margin-left: 10px;
    }
    .banner {
      margin: 20px auto;
    }
    .banner img {
      width: 250px;
    }
    .transparent {
      margin-top: 40px;
    }
    .transparent img {
      width: 300px;
      opacity: 0.5; /* شفافة */
    }
  </style>
</head>
<body>

  <!-- البار الأحمر مع النص والشعار -->
  <header>
    <span>جميع أنواع اختبار الآيلتس</span>
    <img src="images/ielts-logo.png" alt="IELTS Logo">
  </header>

  <!-- الشعارات الثلاثة -->
  <div class="banner">
    <img src="images/three-logos.png" alt="IELTS Three Logos">
  </div>

  <!-- صورة الشعارات الثلاثة الشفافة -->
  <div class="transparent">
    <img src="images/three-logos-transparent.png" alt="Transparent Logos">
