<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>IELTS Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="welcome">
  <!-- الشريط العلوي -->
  <div class="news-bar">
    <marquee behavior="scroll" direction="left">
      مرحباً بكم في بوابة نتائج الآيلتس – لجميع أنواع اختبارات الآيلتس (Academic - General - UKVI - Life Skills)
    </marquee>
  </div>

  <!-- الهيدر مع البانر الأفقي -->
  <div class="header-banner">
    <img src="images/ielts-banner.png" alt="IELTS Banner">
  </div>

  <!-- مربع الترحيب -->
  <div class="welcome-box">
    <div class="big-ielts"><span style="color:#d32f2f;">IELTS</span> نتيجة امتحان الآيلتس</div>
    <form action="results.html" method="get">
      <input type="text" name="candidate" placeholder="أدخل رقم المرشح" required>
      <input type="text" name="serial" placeholder="أدخل رقم السيريال" required>
      <button type="submit">عرض النتيجة</button>
    </form>
  </div>
</body>
</html>
