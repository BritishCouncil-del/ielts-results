<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>IELTS Test Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="index" style="background: url('images/background.jpg') no-repeat center center fixed; background-size: cover;">

  <!-- الهيدر الأحمر -->
  <div class="header" style="background-color:#b30000; padding:15px; text-align:center;">
    <img src="images/ielts-logo.png" alt="IELTS Logo" class="ielts-logo" style="height:60px;">
  </div>

  <!-- البار الأزرق -->
  <div class="bar" style="background-color:#004080; color:white; padding:10px; text-align:center;">
    جميع أنواع اختبار الآيلتس
  </div>

  <!-- مربع البحث -->
  <div class="content" style="text-align:center; margin-top:40px;">
    <form onsubmit="saveData(); return false;">
      <input type="text" id="serial" name="serial" placeholder="Serial Number" required style="padding:10px; width:250px;">
      <input type="text" id="candidate" name="candidate" placeholder="Candidate Number" style="padding:10px; width:250px;">
      <br><br>
      <input type="text" value="IELTS" readonly style="font-size:24px; font-weight:bold; color:#b30000; border:none; background:transparent; text-align:center;">
      <br><br>
      <button type="submit" class="btn" style="padding:10px 20px; background:#b30000; color:white; border:none;">بحث</button>
    </form>
  </div>

  <!-- صورة الشعارات الثلاثة -->
  <div style="text-align:center; margin-top:30px;">
    <img src="images/three-logos.png" alt="IELTS Logos" style="max-width:300px; opacity:0.8;">
  </div>

  <!-- الفوتر -->
  <footer style="text-align:center; margin-top:40px; color:#333;">
    © 2026 IELTS Results Portal | All Rights Reserved | 
    <a href="https://ielts.org" target="_blank">Official IELTS Website</a>
  </footer>

  <script>
    function saveData() {
      const serialInput = document.getElementById("serial").value.trim();
      const candidateInput = document.getElementById("candidate").value.trim();
      localStorage.setItem("serial", serialInput);
      localStorage.setItem("candidate", candidateInput);
      window.location.href = "results.html";
    }
  </script>
</body>
</html>
