<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>IELTS Verification</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- الهيدر الأحمر -->
  <div class="header">
    <div class="logo-box">
      <img src="images/ielts-logo.png" alt="IELTS Logo">
    </div>
    <h1>IELTS Verification System</h1>
  </div>

  <!-- البار الأزرق -->
  <div class="bar">
    <div class="bar-text">Welcome to IELTS Verification Portal - Check Your Results Easily</div>
  </div>

  <!-- مربع الترحيب -->
  <div class="welcome-box">
    <h1 class="big-title">IELTS Check</h1>
    <input type="text" placeholder="Enter Candidate ID">
    <button>Search</button>
    <p class="error">Error message here</p>
  </div>

  <!-- الصورة المتحركة بدل البانر الأبيض -->
  <div class="banner">
    <div class="banner-scroll">
      <img src="images/ielts-banner.png" alt="IELTS Banner">
    </div>
  </div>

  <!-- الفوتر -->
  <footer>
    <p>© 2026 IELTS Verification System | <a href="#">Contact Us</a></p>
  </footer>

</body>
</html>
