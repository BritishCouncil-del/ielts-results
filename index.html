<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>IELTS Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="welcome">
  <div class="welcome-box">
    <h1 class="ielts-title">IELTS</h1>
    <p class="portal-subtitle">English for International Opportunity</p>
    <h2 class="big-ielts">استعلام نتائج الايلتس</h2>
    <form onsubmit="return validateForm()" action="results.html">
      <input type="text" id="candidate" placeholder="رقم المرشح" required>
      <input type="text" id="serial" placeholder="رقم السيريال" required>
      <button type="submit">عرض النتيجة</button>
    </form>
  </div>

  <script>
    function validateForm() {
      const candidate = document.getElementById("candidate").value.trim();
      const serial = document.getElementById("serial").value.trim();
      if(candidate === "" || serial === "") {
        alert("يجب إدخال رقم المرشح ورقم السيريال");
        return false;
      }
      return true;
    }
  </script>
</body>
</html>
