<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>IELTS Test Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="index" style="background: url('images/background.jpg') no-repeat center center fixed; background-size: cover;">

  <div class="header">
    <img src="images/ielts-logos.png" alt="IELTS Logos" class="ielts-logo">
    <h1>بوابة اختبار الآيلتس</h1>
  </div>

  <div class="content">
    <div class="search-box">
      <form onsubmit="saveData(); return false;">
        <input type="text" id="serial" name="serial" placeholder="أدخل الرقم التسلسلي" required>
        <input type="text" id="candidate" name="candidate" placeholder="أدخل رقم المرشح">
        <button type="submit" class="btn">🔍 بحث</button>
      </form>
    </div>
  </div>

  <footer>
    الموقع الرسمي لاختبار IELTS | بوابة نتائج اختبار IELTS ©2026 جميع الحقوق محفوظة
  </footer>

  <script>
    function saveData() {
      const serialInput = document.getElementById("serial").value.trim();
      const candidateInput = document.getElementById("candidate").value.trim();
      localStorage.setItem("serial", serialInput);
      localStorage.setItem("candidate", candidateInput);
      window.location.href = "results.html";
    }
  </script>
</body>
</html>
