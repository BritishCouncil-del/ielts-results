<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IELTS Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="index">

  <!-- الهيدر الأحمر -->
  <div class="header">
    <img src="images/ielts-logo.png" alt="IELTS Logo" class="ielts-logo">
  </div>

  <!-- البار الأزرق -->
  <div class="bar">
    All IELTS Test Types (Academic – General – UKVI – Life Skills)
  </div>

  <!-- مربع البحث -->
  <div class="content">
    <form onsubmit="saveData(); return false;" class="search-box">
      <div class="ielts-title">IELTS</div>
      <input type="text" id="serial" name="serial" placeholder="Serial Number" required>
      <input type="text" id="candidate" name="candidate" placeholder="Candidate Number">
      <button type="submit" class="btn">View Result</button>
    </form>
  </div>

  <!-- صورة الشعارات الثلاثة -->
  <div class="logos">
    <img src="images/three-logos.png" alt="IELTS Logos" class="logos-transparent">
  </div>

  <!-- الفوتر -->
  <footer>
    © 2026 IELTS Results Portal | All Rights Reserved | 
    <a href="https://ielts.org" target="_blank">Official IELTS Website</a>
  </footer>

  <script>
    function saveData() {
      const serialInput = document.getElementById("serial").value.trim();
      const candidateInput = document.getElementById("candidate").value.trim();
      localStorage.setItem("serial", serialInput);
      localStorage.setItem("candidate", candidateInput);
      window.location.href = "results.html";
    }
  </script>
</body>
</html>
