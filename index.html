<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>IELTS Test Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="index">

  <div class="header">
    <img src="images/ielts-logos.png" alt="IELTS Logo" class="ielts-logo">
    <h1>اختبار الآيلتس</h1>
  </div>

  <div class="content">
    <form onsubmit="saveData(); return false;">
      <label for="serial">رقم تسلسلي:</label>
      <input type="text" id="serial" name="serial" required>

      <label for="candidate">رقم المرشح:</label>
      <input type="text" id="candidate" name="candidate">

      <button type="submit" class="btn">عرض النتيجة</button>
    </form>
  </div>

  <footer>
    الموقع الرسمي لاختبار IELTS | بوابة نتائج اختبار IELTS ©2026 جميع الحقوق محفوظة
  </footer>

  <script>
    function saveData() {
      const serialInput = document.getElementById("serial").value.trim();
      const candidateInput = document.getElementById("candidate").value.trim();
      localStorage.setItem("serial", serialInput);
      localStorage.setItem("candidate", candidateInput);
      window.location.href = "results.html";
    }
  </script>
</body>
</html>
