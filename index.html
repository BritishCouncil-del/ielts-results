<div class="login-box">
  <form id="searchForm">
    <label for="candidateNumber">Candidate Number:</label>
    <input type="text" id="candidateNumber" name="candidateNumber" placeholder="Enter Candidate Number">

    <label for="trfCode">TRF Code:</label>
    <input type="text" id="trfCode" name="trfCode" placeholder="Enter TRF Code">

    <button type="submit">عرض النتيجة</button>
  </form>
</div>

<script src="students.js"></script>
<script>
  document.getElementById("searchForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const candidateNumber = document.getElementById("candidateNumber").value.trim();
    const trfCode = document.getElementById("trfCode").value.trim();

    // البحث في بيانات الطلاب
    let student = null;
    for (const key in students) {
      if (students[key].candidate === candidateNumber || students[key].trfNumber === trfCode) {
        student = students[key];
        break;
      }
    }

    if (student) {
      // حفظ بيانات الطالب في localStorage علشان نعرضها في صفحة النتائج
      localStorage.setItem("studentData", JSON.stringify(student));
      window.location.href = "results.html";
    } else {
      alert("لم يتم العثور على بيانات الطالب");
    }
  });
</script>
