<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>IELTS Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="welcome">
  <div class="welcome-box">
    <div class="ielts-title">IELTS</div>
    <div class="portal-subtitle">English for International Opportunity</div>
    <div class="big-ielts">Test Report Form Portal</div>
    <form action="results.html" method="get" onsubmit="return validateForm()">
      <input type="text" id="candidate" placeholder="رقم المرشح" required>
      <input type="text" id="serial" placeholder="رقم السيريال" required>
      <button type="submit">عرض النتيجة</button>
    </form>
  </div>

  <script>
    function validateForm() {
      const candidate = document.getElementById("candidate").value.trim();
      const serial = document.getElementById("serial").value.trim();
      if(candidate === "" || serial === "") {
        alert("يجب إدخال رقم المرشح ورقم السيريال");
        return false;
      }
      return true;
    }
  </script>
</body>
</html>
