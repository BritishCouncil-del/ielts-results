<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>IELTS TRF</title>
  <link rel="stylesheet" href="style.css">
  <script>
    function goToResults() {
      var code = document.getElementById("serial").value;
      if(code.trim() !== ""){
        localStorage.setItem("studentCode", code);
        window.location.href = "results.html";
      } else {
        alert("من فضلك أدخل رقم الشهادة (السيريال)");
      }
    }
  </script>
</head>
<body class="welcome">
  <div class="welcome-box">
    <h1 class="welcome-title">مرحباً بك في نظام عرض النتائج</h1>
    <p>من فضلك أدخل رقم الشهادة (السيريال)</p>
    <input type="text" id="serial" placeholder="أدخل السيريال هنا">
    <button onclick="goToResults()">عرض النتيجة</button>
  </div>
</body>
</html>
