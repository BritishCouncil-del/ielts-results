<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>IELTS Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="welcome">
  <!-- الشريط العلوي -->
  <div class="news-bar">مرحباً بك في بوابة نتائج IELTS</div>

  <!-- الهيدر مع الصورة المجمعة -->
  <div class="header-logos">
    <img src="images/ielts-logos.png" alt="IELTS Logos">
  </div>

  <!-- مربع الترحيب -->
  <div class="welcome-box">
    <div class="big-ielts">نتيجة امتحان الآيلتس</div>
    <form action="results.html" method="get">
      <input type="text" name="candidate" placeholder="أدخل رقم المرشح" required>
      <input type="text" name="serial" placeholder="أدخل رقم السيريال" required>
      <button type="submit">عرض النتيجة</button>
    </form>
  </div>

  <!-- الشعارات أسفل الصفحة -->
  <div class="footer-logos">
    <img src="images/cambridge-logo.png" alt="Cambridge Logo">
    <img src="images/british-council-logo.png" alt="British Council Logo">
    <img src="images/idp-logo.png" alt="IDP Logo">
  </div>
</body>
</html>
