<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IELTS TRF Verification Service</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- الهيدر -->
  <header>
    <div class="logo">IELTS</div>
    <nav>
      <a href="#" onclick="showWelcome()">Home</a>
      <a href="#" onclick="showForm()">TRF Query</a>
      <a href="#">Download Results</a>
      <a href="#">Manage Users</a>
      <a href="#">Update Profile</a>
      <a href="#">FAQs</a>
      <a href="#">IELTS.org</a>
    </nav>
  </header>

  <!-- المحتوى الرئيسي -->
  <main>
    <!-- صفحة الترحيب -->
    <section id="welcomeBox">
      <h1>Welcome to the IELTS Test Report Form (TRF) Verification Service</h1>
    </section>

    <!-- فورم إدخال السيريال -->
    <section id="formBox" class="hidden">
      <h2>Enter TRF Number</h2>
      <input type="text" id="serialInput" placeholder="Enter Serial Number">
      <button onclick="showResult()">Submit</button>
    </section>

    <!-- النتائج -->
    <section id="resultBox" class="result-box hidden"></section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
