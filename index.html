<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>IELTS Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="welcome">
  <!-- الشريط العلوي -->
  <div class="news-bar">
    <marquee behavior="scroll" direction="left">
      مرحباً بكم في بوابة نتائج الآيلتس – لجميع أنواع اختبارات الآيلتس (Academic - General - UKVI - Life Skills)
    </marquee>
  </div>

  <!-- شعار IELTS أعلى الصفحة -->
  <div class="ielts-top-logo">
    <img src="images/ielts-logo.png" alt="IELTS Logo">
  </div>

  <!-- مربع الترحيب -->
  <div class="welcome-box">
    <div class="big-ielts"><span class="ielts-red">IELTS</span> نتيجة امتحان الآيلتس</div>
    <form action="results.html" method="get" class="search-form">
      <div class="input-group">
        <input type="text" name="candidate" placeholder="أدخل رقم المرشح" required>
        <span class="icon">🔍</span>
      </div>
      <div class="input-group">
        <input type="text" name="serial" placeholder="أدخل رقم السيريال" required>
        <span class="icon">🔑</span>
      </div>
      <button type="submit">عرض النتيجة</button>
    </form>
  </div>

  <!-- البانر الأفقي للشعارات الثلاثة أسفل الصفحة -->
  <div class="footer-banner">
    <img src="images/ielts-banner.png" alt="IELTS Banner">
  </div>
</body>
</html>
