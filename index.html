<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IELTS TRF</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f9f9f9;
      text-align: center;
    }
    header {
      margin-bottom: 20px;
    }
    img.logo {
      width: 150px;
    }
    .student {
      margin: 20px auto;
      padding: 10px;
      border: 1px solid #ccc;
      background: #fff;
      width: 300px;
    }
    .student img {
      width: 100%;
      height: auto;
    }
    .student h2 {
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <header>
    <img src="images/ielts-logo.png" alt="IELTS Logo" class="logo">
    <h1>IELTS TRF</h1>
  </header>

  <section class="student">
    <img src="images/student1.jpg" alt="Student Photo">
    <h2>Ahmed Ali</h2>
    <p>Score: 7.5</p>
  </section>

</body>
</html>
