<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>IELTS TRF Portal</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      text-align: center;
    }
    header {
      background: #b30000; /* البار الأحمر */
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      font-size: 18px;
      font-weight: bold;
    }
    header img {
      height: 40px;
      margin-left: 10px;
    }
    .logos {
      margin: 30px auto;
    }
    .logos img {
      width: 250px;
    }
    .login-box {
      background: #fff;
      border: 1px solid #ccc;
      width: 300px;
      margin: 20px auto;
      padding: 20px;
      text-align: left;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .login-box h2 {
      text-align: center;
      margin-bottom: 15px;
      font-size: 16px;
      color: #b30000;
    }
    .login-box input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .login-box button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }
    .login-box button:hover {
      background: #0056b3;
    }
    .transparent {
      margin-top: 40px;
    }
    .transparent img {
      width: 300px;
      opacity: 0.5; /* شفافة */
    }
  </style>
</head>
<body>

  <!-- البار الأحمر مع النص والشعار -->
  <header>
    <span>جميع أنواع اختبار الآيلتس</span>
    <img src="images/ielts-logo.png" alt="IELTS Logo">
  </header>

  <!-- الشعارات الثلاثة -->
  <div class="logos">
    <img src="images/three-logos.png" alt="IELTS Three Logos">
  </div>

  <!-- مربع تسجيل الدخول -->
  <div class="login-box">
    <h2>IELTS – Test Report Form Portal</h2>
    <input type="text" placeholder="رقم التسجيل">
    <input type="text" placeholder="الكود السري">
    <button>عرض النتيجة</button>
  </div>

  <!-- صورة الشعارات الثلاثة الشفافة -->
  <div class="transparent">
    <img src="images/three-logos-transparent.png" alt="Transparent Logos">
  </div>

</body>
</html>
