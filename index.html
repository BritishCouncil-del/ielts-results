<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Test Results - Demo</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="home-page">

<header class="topbar">
    <div class="brand">ENGLISH TEST</div>
    <div class="test-types">
        All English Test Types (Academic - General - UKVI - Life Skills)
    </div>
</header>

<div class="side-menu">
    <a href="#">🏠 Home</a>
    <a href="#">📋 Test Query</a>
    <a href="#">📄 Download Results</a>
    <a href="#">👤 Manage Users</a>
    <a href="#">⚙ Update Profile</a>
    <a href="#">❓ FAQs</a>
</div>

<main class="home-content">

    <div class="portal-logo">
        ENGLISH<br>
        <span>TEST RESULTS</span>
    </div>

    <div class="search-box">

        <div class="demo-title">
            DEMO RESULTS PORTAL
        </div>

        <h2>Result Search</h2>

        <p class="search-note">
            Enter your test information
        </p>

        <input
            type="text"
            id="serial"
            placeholder="Enter Serial Number"
        >

        <input
            type="text"
            id="candidate"
            placeholder="Enter Candidate Number"
        >

        <button onclick="searchResult()">
            Search Result
        </button>

        <div id="error"></div>

    </div>

    <div class="bottom-logos">
        <span>ENGLISH</span>
        <span>CAMBRIDGE</span>
        <span>IDP</span>
    </div>

</main>

<script>

function searchResult(){

    const serial =
        document.getElementById("serial").value.trim();

    const candidate =
        document.getElementById("candidate").value.trim();

    const error =
        document.getElementById("error");

    /*
      Demo credentials only.
      Change these values to your own demo data.
    */

    if(serial === "DEMO123456" && candidate === "507413"){

        window.location.href =
            "results.html?serial=" +
            encodeURIComponent(serial) +
            "&candidate=" +
            encodeURIComponent(candidate);

    }else{

        error.innerHTML =
            "No matching demo result was found.";

    }

}

</script>

</body>
</html>
