<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IELTS TRF Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- الهيدر -->
  <div class="header">
    <h1>IELTS – English for International Opportunity</h1>
    <img src="images/ielts-logos.png" alt="IELTS Logo" class="ielts-logo">
  </div>

  <!-- البار المتحرك -->
  <div class="marquee">
    <marquee behavior="scroll" direction="left" scrollamount="6">
      IELTS Academic | IELTS General Training | IELTS UKVI | IELTS Life Skills
    </marquee>
  </div>

  <!-- نموذج البحث -->
  <div class="content">
    <div class="form-box">
      <h1 class="ielts-title">IELTS</h1>
      <form onsubmit="return goToResults()">
        <input type="text" id="serial" placeholder="TRF Serial Number" required>
        <input type="text" id="candidate" placeholder="Candidate Number" required>
        <button type="submit" class="btn-animate">View Result</button>
      </form>
    </div>

    <!-- صورة الشعارات الثلاثة -->
    <div class="banner-bottom">
      <img src="images/ielts-banner.png" alt="IELTS Banner" class="banner-img">
    </div>
  </div>

  <!-- الفوتر -->
  <footer>
    © 2026 IELTS Results Portal | All Rights Reserved | 
    <a href="https://ielts.org" target="_blank">Official IELTS Website</a>
  </footer>

  <script>
    function goToResults() {
      const serial = document.getElementById('serial').value.trim();
      const candidate = document.getElementById('candidate').value.trim();
      localStorage.setItem('serial', serial);
      localStorage.setItem('candidate', candidate);
      window.location.href = "results.html";
      return false;
    }
  </script>
</body>
</html>
