<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>IELTS TRF Portal</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url("images/background.jpg") no-repeat center center fixed;
      background-size: cover;
    }
    /* البار الأحمر */
    header {
      background: #b30000;
      color: #fff;
      display: flex;
      align-items: center;
      padding: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      overflow: hidden;
      position: relative;
    }
    header img {
      height: 40px;
      margin-right: 15px;
    }
    header span {
      white-space: nowrap;
      position: absolute;
      animation: marquee 12s linear infinite;
    }
    @keyframes marquee {
      0% { left: 100%; }
      100% { left: -100%; }
    }
    /* مربع تسجيل الدخول */
    .login-box {
      background: rgba(255,255,255,0.9);
      border: 1px solid #ccc;
      width: 320px;
      margin: 40px auto 20px auto;
      padding: 20px;
      text-align: left;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      border-radius: 6px;
    }
    .login-box h2 {
      text-align: center;
      margin-bottom: 15px;
      font-size: 16px;
      color: #b30000;
    }
    .login-box input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .login-box button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }
    .login-box button:hover {
      background: #0056b3;
    }
    .logos {
      margin: 20px auto;
      text-align: center;
    }
    .logos img {
      width: 300px;
    }
    .transparent {
      margin-top: 40px;
      text-align: center;
    }
    .transparent img {
      width: 300px;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <!-- البار الأحمر مع النص والشعار -->
  <header>
    <img src="images/ielts-logo.png" alt="IELTS Logo">
    <span>جميع أنواع اختبار الآيلتس</span>
  </header>

  <!-- مربع تسجيل الدخول -->
  <div class="login-box">
    <h2>IELTS – Test Report Form Portal</h2>
    <input type="text" placeholder="رقم التسجيل">
    <input type="text" placeholder="الكود السري">
    <button onclick="window.location.href='results.html'">عرض النتيجة</button>
  </div>

  <!-- الشعارات الثلاثة في صورة واحدة -->
  <div class="logos">
    <img src="images/three-logos.png" alt="IELTS Three Logos">
  </div>

  <!-- صورة الشعارات الثلاثة الشفافة -->
  <div class="transparent">
    <img src="images/three-logos-transparent.png" alt="Transparent Logos">
  </div>

</body>
</html>
