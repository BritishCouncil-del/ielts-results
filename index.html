<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>IELTS Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="welcome">
  <!-- ✅ البار الأحمر مع شعار الآيلتس -->
  <div class="news-bar">
    <div class="ielts-top-logo">
      <img src="images/ielts-full-logo.png" alt="IELTS Logo with 3 logos">
    </div>
    <marquee behavior="scroll" direction="left">
      جميع أنواع اختبار الآيلتس (Academic - General - UKVI - Life Skills)
    </marquee>
  </div>

  <!-- ✅ مربع الترحيب -->
  <div class="welcome-box">
    <h1 class="big-ielts">IELTS Portal</h1>
    <p>أدخل بياناتك للتحقق من نتيجة IELTS الخاصة بك</p>
    <form action="results.html" method="get" class="search-form">
      <input type="text" name="candidate" placeholder="Candidate Number" required>
      <input type="text" name="serial" placeholder="Serial Number" required>
      <button type="submit">عرض النتيجة</button>
    </form>
  </div>
</body>
</html>
