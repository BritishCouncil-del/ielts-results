<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>نظام التحقق من اختبار IELTS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header أحمر -->
  <div class="header">
    <div class="logo-box">
      <img src="images/ielts-logo1.png" alt="IELTS Logo">
    </div>
    <h1>نظام التحقق من اختبار IELTS</h1>
  </div>

  <!-- Welcome box -->
  <div class="welcome-box">
    <h1 class="big-title">IELTS Test</h1>
    <form action="results.html" method="get">
      <input type="text" name="serial" placeholder="أدخل السيريال نمبر" required>
      <input type="text" name="candidate" placeholder="أدخل رقم المرشح" required>
      <button type="submit">يبحث</button>
    </form>
  </div>

  <!-- Logos -->
  <div class="logos">
    <img src="images/ielts-logos.png" alt="IELTS Logos">
  </div>

  <!-- Banner -->
  <div class="banner">
    <div class="banner-scroll">
      <img src="images/ielts-banner.png" alt="IELTS Banner">
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>نظام التحقق من اختبار IELTS ©2026 | <a href="#">britishcouncil.org</a></p>
  </footer>

</body>
</html>
