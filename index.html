<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>IELTS TRF</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>مرحبًا بك في نظام عرض النتائج</h1>
    <p>من فضلك أدخل الكود الخاص بك:</p>
    <input type="text" id="serial" placeholder="ادخل الكود هنا">
    <button onclick="checkCode()">عرض النتيجة</button>
  </div>

  <script>
    function checkCode() {
      var code = document.getElementById("serial").value;

      if(code === "12345"){ 
        // الطالب الأول (مثال قديم)
        window.location.href = "results.html"; 
      } else if(code === "509284"){ 
        // الطالب الجديد (BUTI SAEED SALEM ALMAHDHI)
        window.location.href = "results-509284.html"; 
      } else {
        alert("الكود غير صحيح");
      }
    }
  </script>
</body>
</html>
