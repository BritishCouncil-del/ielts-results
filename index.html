<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IELTS Verification System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Red header -->
  <div class="header">
    <div class="logo-box">
      <img src="images/ielts-logo1.png" alt="IELTS Logo">
    </div>
    <h1>IELTS Verification System</h1>
  </div>

  <!-- Blue bar -->
  <div class="bar">
    <div class="bar-scroll">
      <span class="bar-item">Welcome to IELTS Verification Portal</span>
      <span class="bar-item"><img src="images/academic-icon.png" alt="Academic" class="icon"></span>
      <span class="bar-item"><img src="images/general-icon.png" alt="General Training" class="icon"></span>
      <span class="bar-item"><img src="images/ukvi-icon.png" alt="UKVI" class="icon"></span>
      <span class="bar-item"><img src="images/life-icon.png" alt="Life Skills" class="icon"></span>
    </div>
  </div>

  <!-- Welcome box -->
  <div class="welcome-box">
    <h1 class="big-title">IELTS Test</h1>
    <input type="text" placeholder="Enter Serial Number">
    <input type="text" placeholder="Enter Candidate ID">
    <button>Search</button>
    <p class="error">Error messages here</p>
  </div>

  <!-- IELTS logos -->
  <div class="logos">
    <img src="images/ielts-logos.png" alt="IELTS Logos">
  </div>

  <!-- Moving banner -->
  <div class="banner">
    <div class="banner-scroll">
      <img src="images/ielts-banner.png" alt="IELTS Banner">
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>©2026 IELTS Verification System | <a href="#">britishcouncil.org</a></p>
  </footer>

</body>
</html>
