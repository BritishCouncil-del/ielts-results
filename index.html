<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>نظام التحقق من اختبار IELTS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- الهيدر الأحمر مع شعار IELTS -->
  <div class="header">
    <img src="images/ielts-logo.png" alt="IELTS Logo">
    <h1>نظام التحقق من اختبار IELTS</h1>
  </div>

  <!-- البار الأزرق -->
  <div class="bar">
    <div class="bar-text">مرحباً بكم في بوابة التحقق من نتائج اختبار IELTS - تحقق من نتائجك بسهولة</div>
  </div>

  <!-- مربع الترحيب -->
  <div class="welcome-box">
    <h1 class="big-title">اختبار IELTS</h1>

    <!-- إدخال السيريال نمبر -->
    <input type="text" placeholder="أدخل السيريال نمبر">

    <!-- إدخال رقم المرشح -->
    <input type="text" placeholder="أدخل رقم المرشح">

    <!-- زر البحث -->
    <button>بحث</button>

    <!-- رسالة الخطأ -->
    <p class="error">رسائل الخطأ هنا</p>
  </div>

  <!-- قسم صورة الشعارات الخاصة بـ IELTS -->
  <div class="logos">
    <img src="images/ielts-logos.png" alt="IELTS Logos (Cambridge, British Council, IDP)">
  </div>

  <!-- البانر الأبيض المتحرك -->
  <div class="banner">
    <div class="banner-scroll">
      <img src="images/ielts-banner.png" alt="IELTS Banner">
    </div>
  </div>

  <!-- الفوتر -->
  <footer>
    <p>©2026 نظام التحقق من اختبار IELTS | <a href="#">اتصل بنا</a></p>
  </footer>

</body>
</html>
