<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IELTS Results Portal</title>
</head>
<body>
  <h2>Enter Candidate Number & Serial</h2>
  <form action="results.html" method="get">
    <label>Candidate Number:</label>
    <input type="text" name="candidate" required><br><br>
    <label>Serial Number:</label>
    <input type="text" name="serial" required><br><br>
    <button type="submit">View Results</button>
  </form>
</body>
</html>
