<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IELTS Verification System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Red header with IELTS logo inside white box -->
  <div class="header">
    <div class="logo-box">
      <img src="images/ielts-logo1.png" alt="IELTS Logo">
    </div>
    <h1>IELTS Verification System</h1>
  </div>

  <!-- Blue bar with welcome + test types -->
  <div class="bar">
    <div class="bar-scroll">
      <span class="bar-item">Welcome to IELTS Verification Portal</span>
      <span class="bar-item">★ Academic</span>
      <span class="bar-item">★ General Training</span>
      <span class="bar-item">★ UKVI</span>
      <span class="bar-item">★ Life Skills</span>
    </div>
  </div>

  <!-- Welcome box -->
  <div class="welcome-box">
    <h1 class="big-title">IELTS Test</h1>

    <!-- Serial number input -->
    <input type="text" placeholder="Enter Serial Number">

    <!-- Candidate ID input -->
    <input type="text" placeholder="Enter Candidate ID">

    <!-- Search button -->
    <button>Search</button>

    <!-- Error message -->
    <p class="error">Error messages here</p>
  </div>

  <!-- IELTS logos under the search box (larger size) -->
  <div class="logos">
    <img src="images/ielts-logos.png" alt="IELTS Logos (Cambridge, British Council, IDP)">
  </div>

  <!-- Moving banner image only -->
  <div class="banner">
    <div class="banner-scroll">
      <img src="images/ielts-banner.png" alt="IELTS Banner">
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>©2026 IELTS Verification System | <a href="#">Contact Us</a></p>
  </footer>

</body>
</html>
