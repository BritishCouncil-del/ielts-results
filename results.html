<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>نتيجة IELTS</title>
  <link rel="stylesheet" href="style.css">
  <script src="students.js"></script>
</head>
<body>
  <div class="container" id="resultContainer">
    <h1>نتيجة الطالب</h1>
  </div>

  <script>
    const code = localStorage.getItem("studentCode");
    const student = students[code];

    if(student){
      document.getElementById("resultContainer").innerHTML += `
        <img src="${student.image}" alt="صورة الطالب" class="student-img">
        <p><strong>الاسم:</strong> ${student.name}</p>
        <p><strong>رقم المرشح:</strong> ${student.candidateNumber}</p>
        <p><strong>تاريخ الميلاد:</strong> ${student.dob}</p>
        <p><strong>الجنسية:</strong> ${student.nationality}</p>
        <h2>الدرجات</h2>
        <p><strong>الاستماع:</strong> ${student.listening}</p>
        <p><strong>القراءة:</strong> ${student.reading}</p>
        <p><strong>الكتابة:</strong> ${student.writing}</p>
        <p><strong>المحادثة:</strong> ${student.speaking}</p>
        <p><strong>المجموع الكلي:</strong> ${student.overall} (${student.cefr})</p>
        <p><strong>تاريخ الاختبار:</strong> ${student.examDate}</p>
        <p><strong>رقم TRF:</strong> ${student.trf}</p>
      `;
    } else {
      document.getElementById("resultContainer").innerHTML += "<p>لا توجد بيانات لهذا السيريال.</p>";
    }
  </script>
</body>
</html>
