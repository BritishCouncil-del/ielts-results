<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>IELTS TRF Results</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url("images/background.jpg") no-repeat center center fixed;
      background-size: cover;
      text-align: center;
      color: #333;
    }
    header {
      background: #b30000;
      color: #fff;
      padding: 10px;
      font-size: 20px;
      font-weight: bold;
    }
    .result-box {
      background: rgba(255,255,255,0.95);
      border: 1px solid #ccc;
      width: 400px;
      margin: 40px auto;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      border-radius: 6px;
      text-align: left;
    }
    .result-box h2 {
      text-align: center;
      color: #b30000;
      margin-bottom: 20px;
    }
    .result-box p {
      font-size: 16px;
      margin: 8px 0;
    }
    .logos {
      margin: 30px auto;
    }
    .logos img {
      width: 300px;
    }
    .transparent {
      margin-top: 40px;
    }
    .transparent img {
      width: 300px;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <!-- البار الأحمر -->
  <header>
    نتائج اختبار الآيلتس
  </header>

  <!-- صندوق النتائج -->
  <div class="result-box">
    <h2>مرحبًا أحمد، هذه نتائجك</h2>
    <p><strong>الاسم:</strong> أحمد علي</p>
    <p><strong>رقم التسجيل:</strong> 509284</p>
    <p><strong>الدرجة الكلية:</strong> 7.5</p>
    <p><strong>الاستماع:</strong> 7.0</p>
    <p><strong>القراءة:</strong> 7.5</p>
    <p><strong>الكتابة:</strong> 7.0</p>
    <p><strong>المحادثة:</strong> 8.0</p>
  </div>

  <!-- الشعارات الثلاثة -->
  <div class="logos">
    <img src="images/three-logos.png" alt="IELTS Three Logos">
  </div>

  <!-- الشعارات الثلاثة الشفافة -->
  <div class="transparent">
    <img src="images/three-logos-transparent.png" alt="Transparent Logos">
  </div>

</body>
</html>
