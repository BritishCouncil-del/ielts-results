<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IELTS Results</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo-box">
      <img src="images/ielts-logo1.png" alt="IELTS Logo">
    </div>
    <h1>IELTS™ English for International Opportunity</h1>
  </div>

  <!-- Results Box -->
  <div class="results-box">
    <h2>Test Report Form (TRF)</h2>
    <img id="studentPhoto" src="" alt="Student Photo" style="width:150px;float:right;margin:10px;">
    <table>
      <tr><td><strong>Candidate Number:</strong></td><td id="candidateNumber"></td></tr>
      <tr><td><strong>Name:</strong></td><td id="studentName"></td></tr>
      <tr><td><strong>Date of Birth:</strong></td><td id="dob"></td></tr>
      <tr><td><strong>Test Date:</strong></td><td id="examDate"></td></tr>
      <tr><td><strong>Listening:</strong></td><td id="listening"></td></tr>
      <tr><td><strong>Reading:</strong></td><td id="reading"></td></tr>
      <tr><td><strong>Writing:</strong></td><td id="writing"></td></tr>
      <tr><td><strong>Speaking:</strong></td><td id="speaking"></td></tr>
      <tr><td><strong>Overall Band Score:</strong></td><td id="overall" class="score"></td></tr>
    </table>
  </div>

  <!-- Footer -->
  <footer>
    <p>©2026 IELTS Verification System | <a href="#">britishcouncil.org</a></p>
  </footer>

  <script src="students.js"></script>
  <script>
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    const serial = getQueryParam("serial");
    const candidate = getQueryParam("candidate");
    const student = students[serial];

    if (student && student.candidate === candidate) {
      document.getElementById("studentName").textContent = student.name;
      document.getElementById("candidateNumber").textContent = student.candidate;
      document.getElementById("dob").textContent = student.dob;
      document.getElementById("examDate").textContent = student.examDate;
      document.getElementById("overall").textContent = student.overall;
      document.getElementById("listening").textContent = student.listening;
      document.getElementById("reading").textContent = student.reading;
      document.getElementById("writing").textContent = student.writing;
      document.getElementById("speaking").textContent = student.speaking;
      document.getElementById("studentPhoto").src = "images/" + student.image;
    } else {
      alert("❌ البيانات غير صحيحة أو الطالب غير موجود");
    }
  </script>
</body>
</html>
