<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>النتائج</title>
  <style>
    body {
      font-family: Tahoma, sans-serif;
      background-color: #fff;
      margin: 40px;
    }
    h1 {
      text-align: center;
      color: #444;
    }
    table {
      width: 80%;
      margin: auto;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 12px;
      text-align: center;
    }
    th {
      background-color: #f2f2f2;
    }
    tr:hover {
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>
  <h1>نتائج الاختبار</h1>
  <table>
    <tr>
      <th>الاسم</th>
      <th>الدرجة</th>
    </tr>
    <tr>
      <td>أحمد</td>
      <td>95%</td>
    </tr>
    <tr>
      <td>محمد</td>
      <td>88%</td>
    </tr>
    <tr>
      <td>سارة</td>
      <td>92%</td>
    </tr>
  </table>
</body>
</html>
