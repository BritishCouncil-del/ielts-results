<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IELTS Results</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- الهيدر الأحمر -->
  <div class="header">
    <h1>IELTS</h1>
  </div>

  <!-- البار الأزرق -->
  <div class="bar">
    All IELTS Test Types (Academic – General – UKVI – Life Skills)
  </div>

  <!-- القوائم الجانبية -->
  <aside class="sidebar">
    <ul>
      <li><a href="index.html">🏠 Home</a></li>
      <li><a href="#">TRF Query</a></li>
      <li><a href="#">Download Results</a></li>
      <li><a href="#">Manage Users</a></li>
      <li><a href="#">Update Profile</a></li>
      <li><a href="#">FAQs</a></li>
      <li><a href="https://ielts.org" target="_blank">IELTS.org</a></li>
    </ul>
  </aside>

  <!-- بيانات الطالب -->
  <div class="content">
    <div class="result-card">
      <img id="studentPhoto" class="student-photo" alt="Candidate Photo">
      <table class="results-table" id="resultsTable"></table>
    </div>

    <!-- الشعارات الثلاثة -->
    <div class="footer-logos">
      <img src="images/ielts-logos.png" alt="IELTS Logos" class="footer-img">
    </div>
  </div>

  <!-- الفوتر -->
  <footer>
    © 2026 IELTS Results Portal | All Rights Reserved |
    <a href="https://ielts.org" target="_blank">Official IELTS Website</a>
  </footer>

  <script>
    const student = JSON.parse(localStorage.getItem("student"));
    if(student){
      document.getElementById("studentPhoto").src = student.photo;
      const table = document.getElementById("resultsTable");
      table.innerHTML = `
        <tr><td><strong>Centre Number:</strong></td><td>${student.centreNumber}</td></tr>
        <tr><td><strong>Centre Name:</strong></td><td>${student.centreName}</td></tr>
        <tr><td><strong>Candidate Number:</strong></td><td>${student.candidateNumber}</td></tr>
        <tr><td><strong>Name:</strong></td><td>${student.name}</td></tr>
        <tr><td><strong>Date of Birth:</strong></td><td>${student.dob}</td></tr>
        <tr><td><strong>Gender:</strong></td><td>${student.gender}</td></tr>
        <tr><td><strong>Listening:</strong></td><td>${student.listening}</td></tr>
        <tr><td><strong>Reading:</strong></td><td>${student.reading}</td></tr>
        <tr><td><strong>Writing:</strong></td><td>${student.writing}</td></tr>
        <tr><td><strong>Speaking:</strong></td><td>${student.speaking}</td></tr>
        <tr class="score-row"><td><strong>Overall Band Score:</strong></td><td>${student.overall}</td></tr>
        <tr><td><strong>Test Date:</strong></td><td>${student.testDate}</td></tr>
        <tr><td><strong>TRF Number:</strong></td><td>${student.trfNumber}</td></tr>
      `;
    }
  </script>

</body>
</html>
