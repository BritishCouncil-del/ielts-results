<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IELTS Results</title>
  <link rel="stylesheet" href="style.css">

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="IELTS Results Portal">
  <meta property="og:description" content="View your IELTS Test Report Form (TRF) results online.">
