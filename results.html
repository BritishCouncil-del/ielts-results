<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>IELTS TRF Results</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url("images/background.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #333;
    }
    /* الهيدر الأحمر */
    header {
      background: #b30000;
      color: #fff;
      display: flex;
      align-items: center;
      padding: 10px 20px;
    }
    header img {
      height: 40px;
      margin-right: 15px;
    }
    /* البار الماشي */
    .marquee {
      background: #b30000;
      color: #fff;
      padding: 5px;
      overflow: hidden;
      position: relative;
    }
    .marquee span {
      white-space: nowrap;
      position: absolute;
      animation: marquee 12s linear infinite;
    }
    @keyframes marquee {
      0% { left: 100%; }
      100% { left: -100%; }
    }
    /* القوائم الجانبية */
    nav {
      background: #b30000;
      color: #fff;
      width: 200px;
      min-height: 100vh;
      float: left;
      padding: 20px;
    }
    nav a {
      display: block;
      color: #fff;
      text-decoration: none;
      margin: 10px 0;
    }
    nav a:hover {
      text-decoration: underline;
    }
    /* كارد النتائج */
    .content {
      margin-left: 220px;
      padding: 20px;
    }
    .result-card {
      background: rgba(255,255,255,0.95);
      border: 1px solid #ccc;
      width: 600px;
      margin: 20px auto;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      border-radius: 6px;
      display: flex;
      gap: 20px;
    }
    .result-card img {
      width: 120px;
      height: auto;
      border: 1px solid #ccc;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    table tr:nth-child(even) {
      background: #f2f2f2;
    }
    table tr:nth-child(odd) {
      background: #fff;
    }
    table td {
      padding: 8px;
      border: 1px solid #ccc;
    }
    .download-btn {
      display: block;
      margin: 20px auto 0 auto;
      padding: 10px 20px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }
    .download-btn:hover {
      background: #0056b3;
    }
    /* الشعارات */
    .logos {
      margin: 30px auto;
      text-align: center;
    }
    .logos img {
      width: 350px;
    }
  </style>
</head>
<body>

  <!-- الهيدر الأحمر -->

    <h1>نتائج اختبار الآيلتس</h1>

  <div class="marquee">

    <a href="#">الأسئلة الشائعة</a>

  </nav>
