<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>IELTS Header</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f5f5f5;
    }
    /* الهيدر الأحمر مع الكرف */
    .header {
      position: relative;
      background: #b30000;
      color: #fff;
      padding: 40px 30px 70px 30px; /* مساحة كافية للنص */
      clip-path: polygon(0 0, 100% 0, 100% 75%, 0 100%); /* الكرف المائل */
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    }
    .header h1 {
      margin: 0;
      font-size: 48px; /* تكبير كلمة IELTS */
      font-weight: bold;
      letter-spacing: 1px;
    }
    .header h2 {
      margin: 8px 0 0 0;
      font-size: 22px;
      font-weight: normal;
    }
    /* البار الأزرق */
    .marquee {
      background: #0056b3;
      color: #fff;
      padding: 18px; /* زيادة العرض علشان النص يظهر */
      overflow: hidden;
      position: relative;
      font-weight: bold;
      font-size: 18px;
    }
    .marquee span {
      white-space: nowrap;
      position: absolute;
      animation: marquee 20s linear infinite;
    }
    @keyframes marquee {
      0% { left: 100%; }
      100% { left: -100%; }
    }
  </style>
</head>
<body>

  <!-- الهيدر الأحمر بالكرف -->
  <div class="header">
    <h1>IELTS™</h1>
    <h2>English for International Opportunity</h2>
  </div>

  <!-- البار الأزرق -->
  <div class="marquee">
    <span>IELTS Academic | IELTS General Training | IELTS UKVI | IELTS Life Skills</span>
  </div>

</body>
</html>
