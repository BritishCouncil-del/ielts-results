<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>IELTS TRF Results</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url("images/background.jpg") no-repeat center center fixed;
      background-size: cover;
      text-align: center;
      color: #333;
    }
    header {
      background: #b30000;
      color: #fff;
      display: flex;
      align-items: center;
      padding: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      overflow: hidden;
      position: relative;
    }
    header img {
      height: 40px;
      margin-right: 15px;
    }
    header span {
      white-space: nowrap;
      position: absolute;
      animation: marquee 12s linear infinite;
    }
    @keyframes marquee {
      0% { left: 100%; }
      100% { left: -100%; }
    }
    .result-box {
      background: rgba(255,255,255,0.95);
      border: 1px solid #ccc;
      width: 400px;
      margin: 40px auto;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      border-radius: 6px;
      text-align: left;
    }
    .result-box h2 {
      text-align: center;
      color: #b30000;
      margin-bottom: 20px;
    }
    .result-box p {
      font-size: 16px;
      margin: 8px 0;
    }
    .logos {
      margin: 30px auto;
    }
    .logos img {
      width: 300px;
    }
    .transparent {
      margin-top: 40px;
    }
    .transparent img {
      width: 300px;
      opacity: 0.5;
    }
    .back-btn {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
    }
    .back-btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <header>
    <img src="images/ielts-logo1.png" alt="IELTS Logo">
    <span>نتائج اختبار الآيلتس</span>
  </header>

  <div class="result-box">
    <h2>مرحبًا أحمد، هذه نتائجك</h2>
    <p><strong>الاسم:</strong> أحمد علي</p>
    <p><strong>رقم التسجيل:</strong> 509284</p>
    <p><strong>الدرجة الكلية:</strong> 7.5</p>
    <p><strong>الاستماع:</strong> 7.0</p>
    <p><strong>القراءة:</strong> 7.5</p>
    <p><strong>الكتابة:</strong> 7.0</p>
    <p><strong>المحادثة:</strong> 8.0</p>
  </div>

  <div class="logos">
    <img src="images/ielts-logos.png" alt="IELTS Three Logos">
  </div>

  <div class="transparent">
    <img src="images/ielts-logos.png" alt="Transparent Logos" style="opacity:0.5;">
  </div>

  <a href="index.html" class="back-btn">رجوع لصفحة الترحيب</a>

</body>
</html>
