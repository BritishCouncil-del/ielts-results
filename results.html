<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IELTS Results</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="results">
  <!-- ✅ الهيدر الأصلي -->
  <div class="header-bar">
    <h1 class="header-title">IELTS</h1>
    <span class="header-sub">Academic | General | UKVI | Life Skills</span>
  </div>

  <!-- ✅ البانر الأصلي -->
  <div class="news-bar">
    <marquee behavior="scroll" direction="left">
      All IELTS Test Types (Academic - General - UKVI - Life Skills)
    </marquee>
    <div class="ielts-top-logo">
      <img src="images/ielts-logos.png" alt="IELTS Logos">
    </div>
  </div>

  <!-- ✅ مكان عرض بيانات الطالب -->
  <div class="results-box">
    <img id="studentPhoto" alt="Student Photo" class="student-photo">
    <table class="results-table">
      <tr><th>Name</th><td id="studentName"></td></tr>
      <tr><th>Candidate Number</th><td id="candidateNumber"></td></tr>
      <tr><th>Date of Birth</th><td id="dob"></td></tr>
      <tr><th>Exam Date</th><td id="examDate"></td></tr>
      <tr><th>Listening</th><td id="listening"></td></tr>
      <tr><th>Reading</th><td id="reading"></td></tr>
      <tr><th>Writing</th><td id="writing"></td></tr>
      <tr><th>Speaking</th><td id="speaking"></td></tr>
      <tr><th>Overall Band Score</th><td id="overall"></td></tr>
    </table>
  </div>

  <!-- ✅ كود جلب البيانات -->
  <script src="students.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const serial = urlParams.get("serial");
    const student = students[serial];

    if (student) {
      document.getElementById("studentName").textContent = student.name;
      document.getElementById("candidateNumber").textContent = student.candidate;
      document.getElementById("dob").textContent = student.dob;
      document.getElementById("examDate").textContent = student.examDate;
      document.getElementById("listening").textContent = student.listening;
      document.getElementById("reading").textContent = student.reading;
      document.getElementById("writing").textContent = student.writing;
      document.getElementById("speaking").textContent = student.speaking;
      document.getElementById("overall").textContent = student.overall;
      document.getElementById("studentPhoto").src = "images/" + student.image;
    } else {
      alert("No results found for this candidate.");
    }
  </script>
</body>
</html>
