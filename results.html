<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IELTS Results</title>
  <link rel="stylesheet" href="style.css">

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="IELTS Results Portal">
  <meta property="og:description" content="View your IELTS Test Report Form (TRF) results online.">
  <meta property="og:image" content="https://britishcouncil-del.github.io/ielts-results/images/ielts-logo2.png">
  <meta property="og:url" content="https://britishcouncil-del.github.io/ielts-results/results.html">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="IELTS Results Portal">
  <meta name="twitter:description" content="View your IELTS Test Report Form (TRF) results online.">
  <meta name="twitter:image" content="https://britishcouncil-del.github.io/ielts-results/images/ielts-logo2.png">
</head>
<body class="results">
  <!-- ✅ محتوى صفحة النتائج الأصلي بدون أي تغيير -->
  <div class="header-bar">
    <h1 class="header-title">IELTS</h1>
    <span class="header-sub">Academic | General | UKVI | Life Skills</span>
  </div>

  <div class="news-bar">
    <marquee behavior="scroll" direction="left">
      All IELTS Test Types (Academic - General - UKVI - Life Skills)
    </marquee>
    <div class="ielts-top-logo">
      <img src="images/ielts-logos.png" alt="IELTS Logos">
    </div>
  </div>

  <!-- هنا بيظهر جدول النتائج أو بيانات الطالب -->
  <div class="results-box">
    <img src="images/student-photo.png" alt="Student Photo" class="student-photo">
    <table class="results-table">
      <tr><th>Listening</th><td>7.5</td></tr>
      <tr><th>Reading</th><td>7.0</td></tr>
      <tr><th>Writing</th><td>6.5</td></tr>
      <tr><th>Speaking</th><td>7.0</td></tr>
      <tr><th>Overall Band Score</th><td>7.0</td></tr>
    </table>
    <button class="download-btn" onclick="downloadPDF()">⬇️ Download PDF</button>
  </div>
</body>
</html>
